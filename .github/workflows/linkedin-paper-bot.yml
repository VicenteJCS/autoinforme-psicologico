name: LinkedIn paper bot repair

on:
  workflow_dispatch:

jobs:
  cleanup-buffer-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove historical posts queued during testing
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python linkedin-paper-bot/cleanup_scheduled.py
