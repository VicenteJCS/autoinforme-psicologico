name: LinkedIn paper bot

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'linkedin-paper-bot/**'
      - '.github/workflows/linkedin-paper-bot.yml'

permissions:
  contents: write

concurrency:
  group: linkedin-paper-bot
  cancel-in-progress: false

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'linkedin-paper-bot/requirements.txt'

      - name: Install translation dependency
        run: pip install -r linkedin-paper-bot/requirements.txt

      - name: Test offline English-Spanish translation
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'linkedin-paper-bot')
          import auto_post
          text = auto_post.translate_to_spanish('This study evaluated stress in military personnel.')
          print('Translation test:', text)
          if not text or text.startswith('This study'):
              raise SystemExit('English-Spanish translation was not available')
          PY

      - name: Validate Buffer connection
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python linkedin-paper-bot/check_buffer.py

      - name: Detect new papers and schedule LinkedIn post
        env:
          AUTHOR_ORCID: '0000-0002-2397-2801'
          CROSSREF_MAILTO: 'vctxente@yahoo.es'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python linkedin-paper-bot/auto_post.py

      - name: Persist bot state
        run: |
          if git diff --quiet -- linkedin-paper-bot/state.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkedin-paper-bot/state.json
          git commit -m "Update LinkedIn paper bot state"
          git push
