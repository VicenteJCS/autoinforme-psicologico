name: LinkedIn paper production

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-paper-production
  cancel-in-progress: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'linkedin-paper-bot/requirements.txt'

      - name: Validate Buffer connection
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python linkedin-paper-bot/check_buffer.py

      - name: Detect and publish one verified new article
        env:
          AUTHOR_ORCID: '0000-0002-2397-2801'
          CROSSREF_MAILTO: 'vctxente@yahoo.es'
          WATCH_START: '2026-09-15'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python linkedin-paper-bot/production_safe.py

      - name: Persist bot state
        if: always()
        run: |
          if git diff --quiet -- linkedin-paper-bot/state.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkedin-paper-bot/state.json
          git commit -m "Update LinkedIn paper bot state"
          git push
